{% extends 'base.html' %}
{% block title %}QR Menu Unavailable — {{ bakery_name }}{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="container" style="max-width:760px">
    <div class="card">
      <div class="card-body text-center" style="padding:2rem">
        <h1 class="section-title mb-2">QR menu unavailable</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="flex justify-center gap-2 flex-wrap">
          <a class="btn btn-primary" href="{{ url_for('customer.products') }}">Open General Menu</a>
          <a class="btn btn-outline" href="tel:{{ store_details.phone_tel }}">Ask Staff</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
